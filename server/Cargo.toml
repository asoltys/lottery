[package]
name = "lottery-arcade"
version = "0.1.0"
edition = "2021"
description = "Browser-playable jackpot lottery served by a forked Cube engine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lottery-engine"
path = "src/main.rs"

[dependencies]
# The forked Cube engine. For local cube development, override with a path dep,
# e.g. add to ~/.cargo/config.toml:
#   [patch."https://github.com/asoltys/cube"]
#   cube = { path = "/home/adam/cube" }
cube = { git = "https://github.com/asoltys/cube", branch = "local/regtest-network" }
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.40.0", features = ["full"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
bitcoincore-rpc = "0.19.0"
bitcoin = "0.32.5"
chrono = "0.4.39"
hex = "0.4.3"
secp = { version = "0.4.1", default-features = false, features = ["k256", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "0.2"
